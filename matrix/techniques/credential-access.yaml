# Tactic: Credential Access — stealing authentication material.
# Prefix EXT-CRED.
techniques:
  - id: EXT-CRED-001
    name: Cookie / Session Theft
    tactic: Credential Access
    status: active
    description: >
      The extension reads cookies in bulk via the cookies API (notably session cookies
      for authenticated sites) and transmits them off-device, enabling session hijacking.
    platforms: [chrome, edge, firefox, safari]
    apis: [cookies.getAll]
    permissions: [cookies, "<all_urls>"]
    manifest_fingerprint: ["cookies", "cookies.getAll", "<all_urls>"]
    detection_ideas:
      - "Inventory: cookies + broad host permissions; egress of cookie-like/base64 payloads to non-allowlisted hosts."
    related: [EXT-EXFIL-001, EXT-PRIVESC-002]
    mitre_attack_xref: ["T1176.001", "T1539"]
    real_world_examples:
      - title: "Grandoreiro Malware Now Targeting Banks in Spain"
        url: "https://www.ibm.com/think/x-force/grandoreiro-malware-now-targeting-banks-in-spain"
        publisher: "IBM Security Intelligence / X-Force (Abramov)"
        date: "2020-04-13"
        attribution: "Grandoreiro uses malicious browser extensions to steal cookies and user info; cited by MITRE ATT&CK T1176.001 (S0531)."
      - title: "Your Data Is Under New Lummanagement: The Rise of LummaStealer"
        url: "https://www.cybereason.com/blog/threat-analysis-rise-of-lummastealer"
        publisher: "Cybereason"
        date: "2025-03"
        attribution: "Lumma Stealer installs a malicious extension targeting Chrome, Edge, Opera and Brave to steal data; cited by MITRE ATT&CK T1176.001 (S1213)."
      - title: "Cyberhaven Extension Compromise"
        url: "https://secureannex.com/blog/cyberhaven-extension-compromise/"
        publisher: "Secure Annex (John Tuckner)"
        date: "2024-12-27"
        attribution: "The malicious Cyberhaven update used chrome.cookies.getAll() to collect cookies for a target domain (e.g. Facebook) and POST them to the attacker domain cyberhavenext[.]pro."
    references:
      - "https://attack.mitre.org/techniques/T1176/001/"
      - "https://secureannex.com/blog/cyberhaven-extension-compromise/"

  - id: EXT-CRED-002
    name: Authenticated-Page DOM Reading
    tactic: Credential Access
    status: active
    description: >
      A content script reads sensitive data rendered on authenticated pages (account
      details, tokens embedded in the DOM, session state) and exfiltrates it.
    platforms: [chrome, edge, firefox, safari]
    apis: [scripting.executeScript]
    permissions: ["<all_urls>"]
    manifest_fingerprint: ["content_scripts", "document.querySelector", "innerText"]
    detection_ideas:
      - "Behavioral: content script on banking/webmail origins followed by egress."
    related: [EXT-EXEC-001, EXT-COLL-002]
    mitre_attack_xref: ["T1176.001"]
    real_world_examples:
      - title: "Mispadu: Advertisement for a discounted Unhappy Meal"
        url: "https://www.welivesecurity.com/2019/11/19/mispadu-advertisement-discounted-unhappy-meal/"
        publisher: "ESET (WeLiveSecurity)"
        date: "2019-11-19"
        attribution: "Mispadu uses malicious Chrome extensions to steal financial data; cited by MITRE ATT&CK T1176.001 (S1122)."
      - title: "TA413 Leverages New FriarFox Browser Extension to Target the Gmail Accounts of Global Tibetan Organizations"
        url: "https://www.proofpoint.com/uk/blog/threat-insight/ta413-leverages-new-friarfox-browser-extension-target-gmail-accounts-global"
        publisher: "Proofpoint (Raggi)"
        date: "2021-02-25"
        attribution: "Firefox 'FriarFox' extension accessing authenticated Gmail session data; cited by MITRE ATT&CK T1176.001."
    references:
      - "https://attack.mitre.org/techniques/T1176/001/"

  - id: EXT-CRED-003
    name: Form / Keystroke Capture
    tactic: Credential Access
    status: active
    description: >
      Content-script listeners capture keystrokes and form submissions (including
      password fields) across sites and send them to an operator.
    platforms: [chrome, edge, firefox, safari]
    manifest_fingerprint: ["addEventListener(\"keydown\"", "addEventListener(\"input\"", "\"password\""]
    detection_ideas:
      - "Static: key/input listeners targeting password fields + egress."
    related: [EXT-EXFIL-001]
    mitre_attack_xref: ["T1176.001", "T1056.001"]
    real_world_examples:
      - title: "'Catch-All' Google Chrome Malicious Extension Steals All Posted Data"
        url: "https://isc.sans.edu/diary/CatchAll+Google+Chrome+Malicious+Extension+Steals+All+Posted+Data/22976"
        publisher: "SANS ISC / Morphus Labs (Marinho)"
        date: "2017-10-27"
        attribution: "The extension captured all data posted by the victim on any website (including Gmail login form data) and leaked it to a C&C server; cited by MITRE ATT&CK T1176.001."
    references:
      - "https://isc.sans.edu/diary/CatchAll+Google+Chrome+Malicious+Extension+Steals+All+Posted+Data/22976"
      - "https://attack.mitre.org/techniques/T1176/001/"

  - id: EXT-CRED-004
    name: Token Theft via Request Header Observation
    tactic: Credential Access
    status: active
    description: >
      The extension observes request/response headers (for example via webRequest on
      Firefox, or DNR feedback/observation paths) to capture bearer tokens, auth cookies,
      or API keys in transit.
    platforms: [chrome, edge, firefox]
    scope_note: "Blocking webRequest remains on Firefox; MV3 Chromium webRequest is observe-only."
    apis: [webRequest.onBeforeSendHeaders]
    permissions: [webRequest]
    manifest_fingerprint: ["webRequest", "onBeforeSendHeaders", "Authorization"]
    detection_ideas:
      - "Inventory: webRequest observation of auth headers + egress."
    related: [EXT-EXFIL-001]
    mitre_attack_xref: ["T1176.001"]
    real_world_examples:
      - title: "Cyberhaven Extension Compromise"
        url: "https://secureannex.com/blog/cyberhaven-extension-compromise/"
        publisher: "Secure Annex (John Tuckner)"
        date: "2024-12-27"
        attribution: "The compromised 'AI Assistant - ChatGPT and Gemini for Chrome' used chrome.webRequest.onBeforeSendHeaders with the extraHeaders option to capture sensitive Cookie / Authorization headers in transit and fetch() them to an attacker domain — avoiding adding the cookies permission that would trigger a prompt."
      - title: "Searching for something unknow"
        url: "https://secureannex.com/blog/searching-for-something-unknow"
        publisher: "Secure Annex (John Tuckner)"
        date: "2025-04-10"
        attribution: "A family of 50+ unlisted 'security' extensions (~6M users) configured the extraHeaders option on a webRequest.onBeforeSendHeaders listener to access sensitive 'Authorization' and 'Cookie' headers before requests ran; the depth of tracking was remotely gated by a server-controlled user_conf value."
    references:
      - "https://secureannex.com/blog/cyberhaven-extension-compromise/"
      - "https://secureannex.com/blog/searching-for-something-unknow"

  - id: EXT-CRED-005
    name: Crypto Wallet / Seed-Phrase Theft
    tactic: Credential Access
    status: proposed
    description: >
      The extension targets browser crypto wallets and dApp flows — reading seed
      phrases / private keys from wallet UIs or storage, or intercepting and altering
      transaction-approval and address data — to drain funds.
    platforms: [chrome, edge, firefox]
    apis: [storage.local, scripting.executeScript]
    permissions: [scripting, "<all_urls>"]
    manifest_fingerprint: ["mnemonic", "seed phrase", "privateKey", "ethereum", "web3"]
    store_policy_violations:
      cws: "Malicious and Prohibited Products"
      amo: "§8 Security/Blocking"
      edge: "§1.2.2 Unwanted and malicious software"
    detection_ideas:
      - "Static: wallet/dApp selectors or seed-phrase regexes combined with egress; content scripts on wallet-extension or exchange origins."
      - "Behavioral: clipboard reads/writes around crypto-address patterns (address-swap)."
    related: [EXT-CRED-002, EXT-CRED-003, EXT-EXFIL-001]
    mitre_attack_xref: ["T1176.001"]

  - id: EXT-CRED-006
    name: OTP / 2FA Code Interception
    tactic: Credential Access
    status: active
    description: >
      The extension reads one-time passcodes / second-factor codes from the page DOM or
      intercepts them in transit during sign-in, enabling account takeover even when MFA
      is enabled.
    platforms: [chrome, edge, firefox]
    apis: [scripting.executeScript, webRequest.onBeforeRequest]
    permissions: [scripting, "<all_urls>"]
    manifest_fingerprint: ["otp", "2fa", "verification code", "one-time"]
    detection_ideas:
      - "Behavioral: content script reading OTP input fields or auth responses on login origins; egress correlated with sign-in."
    related: [EXT-CRED-002, EXT-CRED-003, EXT-CRED-001]
    mitre_attack_xref: ["T1176.001", "T1111"]
    real_world_examples:
      - title: "Inside StegoAd: How We Disrupted a Massive Malicious Extension Campaign"
        url: "https://microsoftedge.github.io/edgevr/posts/Inside-StegoAd-How-We-Disrupted-a-Massive-Malicious-Extension-Campaign/"
        publisher: "Microsoft Edge Security / Browser Vulnerability Research"
        date: "2026-06-16"
        attribution: "StegoAd's retrieved payloads intercepted Google credentials and second-factor codes during sign-in and exfiltrated session cookies, enabling account takeover through both stolen passwords and hijacked sessions despite MFA."
    references:
      - "https://microsoftedge.github.io/edgevr/posts/Inside-StegoAd-How-We-Disrupted-a-Massive-Malicious-Extension-Campaign/"

  - id: EXT-CRED-007
    name: Injected Phishing / Fake-Login Overlay
    tactic: Credential Access
    status: proposed
    description: >
      The extension injects a counterfeit login form or credential/payment prompt into a
      legitimate page (or a new tab), harvesting what the user types into the fake UI.
    platforms: [chrome, edge, firefox, safari]
    apis: [scripting.executeScript, tabs.create]
    permissions: [scripting, "<all_urls>"]
    manifest_fingerprint: ["password", "login form", "overlay", "credential"]
    detection_ideas:
      - "Behavioral: content script injecting credential/payment forms absent from the site's own DOM; submission posts to a third-party host."
    related: [EXT-CRED-003, EXT-EXEC-001]
    mitre_attack_xref: ["T1176.001", "T1056.003"]

  - id: EXT-CRED-008
    name: Passkey / WebAuthn Interception
    tactic: Credential Access
    status: proposed
    description: >
      A content script running in the page's main world wraps navigator.credentials.create/get
      to observe, downgrade or relay WebAuthn ceremonies, or to steer the user to a
      password fallback that the extension can then capture. Reported as a research-level
      risk; no in-the-wild campaign is cited yet.
    platforms: [chrome, edge, firefox]
    apis: [navigator.credentials, scripting.executeScript]
    permissions: [scripting, "<all_urls>"]
    manifest_fingerprint: ["navigator.credentials", "PublicKeyCredential", "world: \"MAIN\""]
    detection_ideas:
      - "Static: main-world scripts that reassign navigator.credentials.get/create or PublicKeyCredential methods."
      - "Behavioral: WebAuthn calls on login origins followed by extension-originated network egress."
    related: [EXT-CRED-003, EXT-CRED-006, EXT-EXEC-001]
    mitre_attack_xref: ["T1176.001", "T1556"]

  - id: EXT-CRED-009
    name: Autofill / Password-Manager UI Clickjacking
    tactic: Credential Access
    status: proposed
    description: >
      The extension (or a page it injects into) overlays or manipulates the DOM so that a
      password manager's autofill dropdown fills credentials, cards or TOTP into
      attacker-controlled hidden fields, which the extension then reads.
    platforms: [chrome, edge, firefox]
    apis: [scripting.executeScript, MutationObserver]
    permissions: [scripting, "<all_urls>"]
    manifest_fingerprint: ["opacity: 0", "pointer-events", "autocomplete", "MutationObserver"]
    detection_ideas:
      - "Behavioral: invisible or off-screen input fields injected into login pages by an extension; values read on autofill."
    related: [EXT-CRED-003, EXT-CRED-007]
    mitre_attack_xref: ["T1176.001", "T1056.003"]
